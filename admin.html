<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Banamba</title>
<style>body{font-family:system-ui,Arial;background:#f1f5f3;color:#173c32;margin:0}header{background:#07513c;color:white;padding:22px;text-align:center}main{max-width:750px;margin:28px auto;padding:0 16px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 3px 20px #0001;margin-bottom:16px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 13px;border-radius:8px;border:1px solid #bbb;font:inherit}button{background:#086347;color:white;border:0;cursor:pointer}button.secondary{background:#edf3ef;color:#07513c}button.danger{background:#a52e2e}button:disabled{opacity:.5}textarea{min-height:140px}label{font-weight:600}#notice{white-space:pre-wrap}article{border-top:1px solid #ddd;padding:15px 0}.small{font-size:.9em;color:#52665d}.actions{display:flex;gap:8px}.actions button{width:auto;flex:1}a{color:#087152}</style>
</head><body><header><h1>Commune rurale de Banamba</h1><div>Espace d'administration</div></header><main>
<div class="panel"><a href="./index.html">← Retour au site</a><p id="notice" role="status"></p></div>
<section class="panel" id="login"><h2>Connexion</h2><form id="loginForm"><label for="email">Adresse email</label><input id="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button>Se connecter</button></form><button class="secondary" id="forgot">Mot de passe oublié</button></section>
<section class="panel" id="dashboard" hidden><h2>Tableau de bord</h2><p id="identity"></p><button class="secondary" id="logout">Se déconnecter</button><h3 id="formTitle">Nouvelle publication</h3><form id="postForm"><label for="title">Titre</label><input id="title" maxlength="200" required><label for="category">Catégorie</label><input id="category" maxlength="100" placeholder="Actualités" required><label for="content">Contenu</label><textarea id="content" required></textarea><button id="submitPost">Publier</button><button class="secondary" id="cancelEdit" type="button" hidden>Annuler la modification</button></form><h3>Publications</h3><div id="posts"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const SUPABASE_URL='https://aansosjdgdtwewkrrweg.supabase.co';
// Remplacer la valeur ci-dessous par la clé « publishable » (ou « anon ») de ce projet Supabase.
// Ne jamais utiliser la clé secret ou service_role dans un site public.
const SUPABASE_PUBLIC_KEY='sb_publishable_ftjleL_zXYuDmPi1t0LIrg_XmaT-EdL';
const RECOVERY_URL=new URL('./reset-password.html',location.href).href;
const notice=document.getElementById('notice');
function message(t){notice.textContent=t;}
const ready=SUPABASE_PUBLIC_KEY!=='REMPLACER_PAR_CLE_PUBLIQUE_SUPABASE';
let client=null, sessionUser=null, editingId=null;
if(!ready){message('Configuration nécessaire : renseignez la clé publique Supabase dans admin.html.');document.getElementById('loginForm').querySelector('button').disabled=true;document.getElementById('forgot').disabled=true;}
else {client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY);init();}
async function init(){try{const {data,error}=await client.auth.getUser();if(error && error.name!=='AuthSessionMissingError') throw error;await updateUI(data?.user||null);client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>updateUI(session?.user||null),0);});}catch(e){message('Erreur de connexion : '+e.message);}}
async function updateUI(user){sessionUser=user;document.getElementById('login').hidden=!!user;document.getElementById('dashboard').hidden=true;if(!user)return;try{const {data,error}=await client.from('admin_profiles').select('role,full_name').eq('user_id',user.id).single();if(error)throw error;if(!['admin','super_admin'].includes(data.role)){message('Compte connecté, mais sans autorisation administrateur.');return;}document.getElementById('dashboard').hidden=false;document.getElementById('identity').textContent=(data.full_name||user.email)+' — '+data.role;message('Connexion réussie.');await loadPosts();}catch(e){message('Impossible de vérifier les droits : '+e.message);}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{message('Connexion en cours…');const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data}=await client.auth.getUser();await updateUI(data.user);}catch(err){message('Connexion impossible : '+err.message);}});
document.getElementById('forgot').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email){message('Saisissez d’abord votre adresse email.');return;}try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:RECOVERY_URL});if(error)throw error;message('Si ce compte existe, un email de récupération sera envoyé. Ouvrez le dernier message reçu.');}catch(e){message('Envoi impossible : '+e.message);}});
document.getElementById('logout').addEventListener('click',async()=>{const {error}=await client.auth.signOut();if(error)message(error.message);else{message('Déconnexion réussie.');await updateUI(null);}});
async function loadPosts(){const area=document.getElementById('posts');area.replaceChildren();const {data,error}=await client.from('publications').select('id,title,content,category,published_at,author_id').order('published_at',{ascending:false});if(error){message('Lecture des publications impossible : '+error.message);return;}if(!data.length){area.textContent='Aucune publication pour le moment.';return;}for(const post of data){const article=document.createElement('article'),h=document.createElement('h4'),p=document.createElement('p'),meta=document.createElement('div'),actions=document.createElement('div'),edit=document.createElement('button'),del=document.createElement('button');h.textContent=post.title;p.textContent=post.content;meta.className='small';meta.textContent=(post.category||'Actualités')+' · '+(post.published_at?new Date(post.published_at).toLocaleString('fr-FR'):'Date non renseignée');actions.className='actions';edit.textContent='Modifier';del.textContent='Supprimer';del.className='danger';edit.onclick=()=>{editingId=post.id;document.getElementById('title').value=post.title;document.getElementById('category').value=post.category||'Actualités';document.getElementById('content').value=post.content;document.getElementById('formTitle').textContent='Modifier une publication';document.getElementById('submitPost').textContent='Enregistrer';document.getElementById('cancelEdit').hidden=false;document.getElementById('postForm').scrollIntoView();};del.onclick=async()=>{if(!confirm('Supprimer définitivement cette publication ?'))return;const {error}=await client.from('publications').delete().eq('id',post.id);if(error)message('Suppression refusée : '+error.message);else{message('Publication supprimée.');await loadPosts();}};actions.append(edit,del);article.append(h,meta,p,actions);area.append(article);}}
function resetForm(){editingId=null;document.getElementById('postForm').reset();document.getElementById('formTitle').textContent='Nouvelle publication';document.getElementById('submitPost').textContent='Publier';document.getElementById('cancelEdit').hidden=true;}
document.getElementById('cancelEdit').onclick=resetForm;
document.getElementById('postForm').addEventListener('submit',async e=>{e.preventDefault();if(!sessionUser)return;const payload={title:document.getElementById('title').value.trim(),category:document.getElementById('category').value.trim(),content:document.getElementById('content').value.trim()};if(!payload.title||!payload.content)return;const result=editingId===null?await client.from('publications').insert({...payload,author_id:sessionUser.id}):await client.from('publications').update(payload).eq('id',editingId);if(result.error){message('Enregistrement refusé : '+result.error.message);return;}message('Publication enregistrée.');resetForm();await loadPosts();});
</script></body></html>
