<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réinitialiser le mot de passe - Banamba</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f6f4;margin:0;padding:24px;color:#123b30}
main{max-width:420px;margin:65px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0001}
h1{font-size:24px}
input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:8px;font-size:16px}
input{border:1px solid #bbb}
button{background:#086346;color:white;border:0;cursor:pointer}
button:disabled{opacity:.6}
#message{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Commune rurale de Banamba</h1>
<h2>Nouveau mot de passe</h2>
<p id="message">Vérification du lien de récupération...</p>
<form id="form" hidden>
<input id="password" type="password" placeholder="Nouveau mot de passe" minlength="12" autocomplete="new-password" required>
<input id="confirm" type="password" placeholder="Confirmer le mot de passe" minlength="12" autocomplete="new-password" required>
<button id="save" type="submit">Enregistrer le mot de passe</button>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const client=window.supabase.createClient(
"https://aansosjdgdtwewkrrweg.supabase.co",
"sb_publishable_ftjleL_zXYuDmPi1t0LIrg_XmaT-EdL"
);
const message=document.getElementById("message");
const form=document.getElementById("form");
let recovery=false;
function ready(){
recovery=true;
form.hidden=false;
message.textContent="Choisissez un mot de passe de 12 caractères minimum.";
}
client.auth.onAuthStateChange((event)=>{
if(event==="PASSWORD_RECOVERY") ready();
});
async function init(){
try{
const url=new URL(location.href);
const token=url.searchParams.get("token_hash");
const type=url.searchParams.get("type");
const code=url.searchParams.get("code");
if(token && type==="recovery"){
const {error}=await client.auth.verifyOtp({token_hash:token,type:"recovery"});
if(error) throw error;
ready();
}else if(code){
const {error}=await client.auth.exchangeCodeForSession(code);
if(error) throw error;
ready();
}else if(location.hash.includes("access_token=") && location.hash.includes("type=recovery")){
const {data,error}=await client.auth.getSession();
if(error) throw error;
if(data.session) ready();
}
if(!recovery) message.textContent="Lien absent, expiré ou non reconnu. Demandez un nouveau lien de récupération.";
}catch(e){message.textContent="Impossible de vérifier le lien : "+e.message;}
}
init();
form.addEventListener("submit",async(e)=>{
e.preventDefault();
if(!recovery)return;
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;
if(password!==confirm){message.textContent="Les mots de passe ne correspondent pas.";return;}
const button=document.getElementById("save");
button.disabled=true;
const {error}=await client.auth.updateUser({password});
button.disabled=false;
if(error){message.textContent="Erreur : "+error.message;return;}
form.hidden=true;
message.textContent="Mot de passe enregistré avec succès. Vous pourrez bientôt vous connecter à l'administration.";
await client.auth.signOut();
history.replaceState({},document.title,location.pathname);
});
</script>
</body>
</html>
